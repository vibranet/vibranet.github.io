<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VibraNet™ - lang selection</title>
  
  <link rel="canonical" href="https://vibranet.github.io/en/">
  
  <script>
    (function() {
      // 1. Récupérer la langue principale du navigateur (ex: "fr-FR" -> "fr")
      const userLang = (navigator.language || navigator.userLanguage).toLowerCase().slice(0, 2);

      // 2. Définir les langues supportées par VibraNet™
      const supportedLanguages = ['fr'];

      // 3. Redirection conditionnelle
      if (supportedLanguages.includes(userLang)) {
        window.location.replace('/' + userLang + '/');
      } else {

        // Fallback si la langue n'est pas supportée ou est introuvable
        window.location.replace('/en/');
      }
    })();
  </script>
</head>
<body>
  <noscript>
    <p>Please select your language / Veuillez choisir votre langue :</p>
    <ul>
      <li><a href="en/">English</a></li>
      <li><a href="fr/">Français</a></li>
    </ul>
  </noscript>
</body>
</html>
